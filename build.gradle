plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.github.ilyaandreev05'
version = '0.2.1'

repositories { mavenCentral() }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
javafx { version = '27'; modules = [ 'javafx.controls' ] }

dependencies {
    implementation 'io.github.mkpaz:atlantafx-base:3.0.0'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.20.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'io.github.ilyaandreev05.eventsoundstudio.EventSoundStudioApp'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics,ALL-UNNAMED', '--add-modules=jdk.httpserver']
}
test { useJUnitPlatform() }

tasks.register('verifyClassSize', Exec) {
    commandLine 'python3', 'scripts/check_class_size.py'
}
tasks.named('test') { dependsOn tasks.named('verifyClassSize') }
tasks.named('check') { dependsOn tasks.named('verifyClassSize') }

tasks.register('packageDeb', Exec) {
    dependsOn tasks.installDist, tasks.named('verifyClassSize')
    doFirst {
        def jdkHome = project.findProperty('packageJdkHome') ?: System.getProperty('java.home')
        def appLib = layout.buildDirectory.dir("install/${project.name}/lib").get().asFile
        def mainJar = fileTree(appLib).matching { include "${project.name}-${project.version}.jar" }.singleFile
        def dest = layout.buildDirectory.dir('deb').get().asFile; dest.mkdirs()
        environment 'JAVA_HOME', jdkHome
        environment 'PATH', "${jdkHome}/bin:${System.getenv('PATH')}"
        def args = ["${jdkHome}/bin/jpackage", '--type', 'deb', '--dest', dest.absolutePath,
                '--name', 'EventSoundStudio', '--app-version', project.version.toString(), '--vendor', 'IlyaAndreev05',
                '--description', 'Desktop event sounds and haptic effect bindings',
                '--input', appLib.absolutePath, '--main-jar', mainJar.name, '--main-class', application.mainClass.get(),
                '--java-options', '--module-path $APPDIR --add-modules javafx.controls,jdk.httpserver --enable-native-access=javafx.graphics,ALL-UNNAMED',
                '--linux-shortcut', '--linux-menu-group', 'AudioVideo']
        if (!file("${jdkHome}/bin/jlink").exists() || !file("${jdkHome}/jmods").isDirectory())
            args.addAll(['--runtime-image', jdkHome])
        commandLine args
    }
    doLast {
        def dest = layout.buildDirectory.dir('deb').get().asFile
        def packageFile = dest.listFiles()?.find { it.name.endsWith("_${project.version}_amd64.deb") }
        if (packageFile == null) throw new GradleException('Could not locate the Debian archive to normalize its package version')
        def extracted = layout.buildDirectory.dir('deb-package-root').get().asFile
        project.delete(extracted)
        def runCommand = { List<String> command ->
            def process = new ProcessBuilder(command).inheritIO().start()
            if (process.waitFor() != 0) throw new GradleException("Command failed: ${command.first()}")
        }
        runCommand(['dpkg-deb', '--raw-extract', packageFile.absolutePath, extracted.absolutePath])
        def controlFile = new File(extracted, 'DEBIAN/control')
        def controlText = java.nio.file.Files.readString(controlFile.toPath())
        controlText = controlText.replaceFirst(/(?m)^Version:.*$/, "Version: ${project.version}")
        java.nio.file.Files.writeString(controlFile.toPath(), controlText)
        def extensionId = 'event-sound-studio-events@ilyaandreev05'
        def extensionDirectory = new File(extracted, "opt/eventsoundstudio/lib/gnome-shell/extensions/${extensionId}")
        extensionDirectory.mkdirs()
        copy { from file('gnome/event-sound-studio-events'); include 'metadata.json', 'extension.js'; into extensionDirectory }
        def helperDirectory = new File(extracted, 'opt/eventsoundstudio/bin')
        helperDirectory.mkdirs()
        copy { from files('scripts/install-gnome-events.sh', 'scripts/uninstall-gnome-events.sh'); into helperDirectory }
        new File(helperDirectory, 'install-gnome-events.sh').setExecutable(true, false)
        new File(helperDirectory, 'uninstall-gnome-events.sh').setExecutable(true, false)
        def rebuilt = new File(dest, packageFile.name + '.rebuilt')
        runCommand(['dpkg-deb', '--build', '--root-owner-group', extracted.absolutePath, rebuilt.absolutePath])
        java.nio.file.Files.move(rebuilt.toPath(), packageFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        project.delete(extracted)
    }
}
