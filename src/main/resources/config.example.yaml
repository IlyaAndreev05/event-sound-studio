  "event_types": [
    {
      "id": "key_press",
      "source": "evdev",
      "match": {
        "kind": "key",
        "state": "press"
      }
    },
    {
      "id": "enter_press",
      "source": "evdev",
      "match": {
        "key": "KEY_ENTER",
        "state": "press"
      }
    },
    {
      "id": "mouse_left",
      "source": "evdev",
      "match": {
        "button": "BTN_LEFT",
        "state": "press"
      }
    },
    {
      "id": "mouse_double_left",
      "source": "derived",
      "match": {
        "button": "BTN_LEFT",
        "click_count": 2,
        "window_ms": 250
      }
    },
    {
      "id": "wheel_up",
      "source": "evdev",
      "match": {
        "axis": "vertical",
        "direction": "up",
        "unit": "detent"
      }
    },
    {
      "id": "wheel_down",
      "source": "evdev",
      "match": {
        "axis": "vertical",
        "direction": "down",
        "unit": "detent"
      }
    },
    {
      "id": "wheel_left",
      "source": "evdev",
      "match": {
        "axis": "horizontal",
        "direction": "left",
        "unit": "detent"
      }
    },
    {
      "id": "wheel_right",
      "source": "evdev",
      "match": {
        "axis": "horizontal",
        "direction": "right",
        "unit": "detent"
      }
    },
    {
      "id": "combo_save",
      "source": "evdev",
      "match": {
        "keys": [
          "KEY_LEFTCTRL",
          "KEY_S"
        ],
        "policy": "ONLY_COMBO"
      }
    },
    {
      "id": "desktop_changed",
      "source": "gnome",
      "match": {
        "signal": "workspace_changed"
      }
    },
    {
      "id": "window_focus_changed",
      "source": "gnome",
      "match": {
        "signal": "window_focus_changed"
      }
    },
    {
      "id": "window_opened",
      "source": "gnome",
      "match": {
        "signal": "window_opened"
      }
    },
    {
      "id": "window_closed",
      "source": "gnome",
      "match": {
        "signal": "window_closed"
      }
    },
    {
      "id": "api_test",
      "source": "local_api",
      "match": {
        "event_id": "test"
      }
    },
    {
      "id": "backspace_press",
      "source": "evdev",
      "match": {
        "key": "KEY_BACKSPACE",
        "state": "press"
      }
    },
    {
      "id": "delete_press",
      "source": "evdev",
      "match": {
        "key": "KEY_DELETE",
        "state": "press"
      }
    },
    {
      "id": "notification_visible",
      "source": "gnome",
      "match": {
        "signal": "notification_visible"
      }
    }
  ],
  "groups": [
    {
      "id": "builtin.mouse",
      "name": "Кнопки мыши",
      "protected": true,
      "members": [
        "BTN_LEFT",
        "BTN_RIGHT",
        "BTN_MIDDLE",
        "BTN_SIDE",
        "BTN_EXTRA"
      ],
      "default_sound": "octine-click"
    },
    {
      "id": "builtin.modifiers",
      "name": "Модификаторы",
      "protected": true,
      "members": [
        "KEY_LEFTCTRL",
        "KEY_RIGHTCTRL",
        "KEY_LEFTALT",
        "KEY_RIGHTALT",
        "KEY_LEFTSHIFT",
        "KEY_RIGHTSHIFT",
        "KEY_LEFTMETA",
        "KEY_RIGHTMETA"
      ],
      "default_sound": "octine-click"
    },
    {
      "id": "builtin.function",
      "name": "F1–F12",
      "protected": true,
